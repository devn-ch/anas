# ---------------------------------------------------------------------------
#  AHR self-heal — the fault-rooted decision tree
#
#  Rendered by docs/AHR-SELF-HEAL-DECISION-TREE.md; checked by
#  test/self-heal/check-decision-tree.mjs (which rides `npm run test:unit`
#  through packages/daemon/src/__tests__/selfheal-decision-tree.test.ts).
#
#  READING RULE — this is a fault tree, not a flowchart. A shared decision node
#  carries only its CONTINUE edge; every branch that characterises a particular
#  fault is linked from THAT fault's root. So "which roots reach this leaf" is a
#  real question with a real answer, and `exclusive_actions` below can say which
#  answers are allowed. Wiring an abort branch off a shared decision instead
#  would make every root reach every leaf and the check would prove nothing.
#
#  Every node carries:
#    code: <path>:<symbol>   the thing that implements it, or `none`
#    test: <test file>:<name> | suite:<case id>   what proves it, or `none`
#    gt:   GT-n | none       the ground-truth fact it rests on
#
#  YAML SUBSET: a top-level map of block sequences of flat maps. Inline lists
#  `[a, b]`, double-quoted strings, `#` comments. Nothing else.
# ---------------------------------------------------------------------------

version: 1

# --- Invariants the checker enforces over reachability ----------------------
exclusive_actions:
  - action: md-action-repair
    allowed: [R1]
    reason: 'GT-18: a stripe-bounded `mdadm --action=repair` rewrites parity correctly when the data is intact and BLESSES the rot when it is not, and on a mirror it copies the first in-sync leg over the others without looking at which is right (N1). The only root it may be reached from is parity-only rot with phase 2 proven clean.'
  - action: md-block-write
    allowed: [R2, R3, R5, R6, R9, R15, R16, R19, R23]
    reason: 'GT-7/GT-8: a block goes through md only after a reconstruction matched the checksum btrfs stored for it. A root that cannot produce an arbitrated candidate must never reach the write.'
  - action: restore-from-backup-advice
    allowed: [R1, R3, R4, R6, R7, R9, R10, R11, R14, R16]
    reason: "selfheal.7 F2 / D10: 'restore this file from backup' is advice to OVERWRITE the file, so it may only be reached from a fault where nothing below the checksum tree can prove the block right. The seventh pass took R22 OFF this list (a read-back-guard failure establishes NOTHING about the file — F9) and put four faults ON it, each because the block genuinely cannot be proven: R1 only through E12d, where the block was written AND fails its cold re-read; R4/R9 only through E04f2, where both mirror legs fail and disagree with each other; R11 through E07a, where md has recorded bad blocks over the row and can reconstruct nothing from that member."
  - action: not-corrupt-here-advice
    allowed: [R18]
    reason: 'The mapping-abort sentence asserts a positive fact — the bytes at the mapped location still PASS their stored checksum, so nothing was written and nothing needs restoring. It may only be reached from the fault that actually establishes it.'

# --- Files whose exported surface is scanned for orphan actions -------------
orphan_scan:
  - packages/daemon/src/services/ahr-scrub.ts
  - packages/daemon/src/services/ahr-repair.ts
  - packages/daemon/src/services/ahr-parity-rewrite.ts
  - packages/daemon/src/services/ahr-mirror-reconcile.ts
  - packages/daemon/src/services/selfheal-repair.ts
  - packages/daemon/src/services/selfheal-map.ts
  - packages/daemon/src/services/selfheal-csum.ts
  - packages/daemon/src/services/selfheal-syncop.ts
  - packages/daemon/src/services/selfheal-reconcile.ts
  - packages/daemon/src/services/scrub-schedules.ts
  - packages/daemon/src/services/scrub-schedule-units.ts
  - packages/daemon/src/scrub-task.ts

# --- The 24 faults ----------------------------------------------------------
roots:
  - id: R1
    title: md mismatch with the data intact (parity / Q rot)
    entry: X1
  - id: R2
    title: btrfs csum error — one data member rotted below md
    entry: X2
  - id: R3
    title: two damaged members in one stripe (RAID5 unrepairable / RAID6 Q path)
    entry: X3
  - id: R4
    title: rot that arrived THROUGH md (parity agrees with the bad data)
    entry: X4
  - id: R5
    title: metadata rot (csum tree / fs tree) in a DUP copy
    entry: X5
  - id: R6
    title: compressed-extent rot
    entry: X6
  - id: R7
    title: rot in a file without checksums (NOCOW / prealloc / nodatasum)
    entry: X7
  - id: R8
    title: rot in an extent referenced only by a snapshot (outsideMount)
    entry: X8
  - id: R9
    title: mismatch on a RAID1 band (the legs disagree)
    entry: X9
  - id: R10
    title: 'member failure / degraded array before, during or after a scrub or repair'
    entry: X10
  - id: R11
    title: URE during a rebuild (md bad-block list)
    entry: X11
  - id: R12
    title: daemon SIGKILL / OOM / upgrade-restart mid-repair or mid-scrub
    entry: X12
  - id: R13
    title: power loss mid-repair
    entry: X13
  - id: R14
    title: 'a foreign md op (mdcheck, recovery, reshape) concurrent with ours'
    entry: X14
  - id: R15
    title: a block in band N of a multi-band pool
    entry: X15
  - id: R16
    title: a block backing an iSCSI LUN image
    entry: X16
  - id: R17
    title: check never started / state unknown / counter unreadable
    entry: X17
  - id: R18
    title: 'file changed, truncated, deleted or inode reused between scrub and repair'
    entry: X18
  - id: R19
    title: a crc32c collision on a candidate (accepted residual)
    entry: X19
  - id: R20
    title: 'the periodic timer paths (missed occurrence, vanished job, restart, shared spindles)'
    entry: X20
  - id: R21
    title: 'legacy and foreign states (mdcheck, marker-less units, masked timers, uninstall)'
    entry: X21
  - id: R22
    title: 'mapping failure (unreadable band geometry, unresolvable extent, owner-scan cap)'
    entry: X22
  - id: R23
    title: "the pool's top-level mount held by a backup during a repair"
    entry: X23
  - id: R24
    title: 'the operator names a path outside the pool — a symlink, a bind mount'
    entry: X24

